apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kcna-web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /curso
            pathType: Prefix
            backend:
              service:
                name: kcna-web
                port:
                  number: 80
