apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcna-web
  labels:
    app: kcna-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kcna-web
  template:
    metadata:
      labels:
        app: kcna-web
    spec:
      containers:
        - name: web
          image: localhost/kcna-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /curso/
              port: 80
          securityContext:
            allowPrivilegeEscalation: false
