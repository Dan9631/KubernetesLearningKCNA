server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de Traefik/port-forward nginx no conoce el puerto público (8080):
    # si alguna vez redirige, que sea con ruta relativa para no perder el puerto.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Astro genera /ruta/index.html: servir /ruta y /ruta/ directamente, sin redirección
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Los assets llevan hash en el nombre: cachear mucho
    location ~* /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
