# Modulo 06 - Deployment de ejemplo: traefik/whoami responde con el nombre e IP del pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: lab-06
  labels:
    app: whoami
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
