# Pod endurecido: usuario no root, sistema de archivos de solo lectura, sin capabilities.
apiVersion: v1
kind: Pod
metadata:
  name: pod-seguro
  namespace: lab-05
spec:
  securityContext:                 # nivel pod: aplica a todos los contenedores
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:             # nivel contenedor: tiene prioridad sobre el de pod
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp                # unico sitio con escritura
          mountPath: /tmp
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: tmp
      emptyDir: {}
