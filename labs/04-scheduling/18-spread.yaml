# topologySpreadConstraints: reparte las replicas entre zonas con diferencia maxima de 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-repartida
  namespace: lab-04
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-repartida
  template:
    metadata:
      labels:
        app: web-repartida
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web-repartida
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
