# Toleration (permite entrar al nodo con taint) + node affinity (obliga a ir a el).
# Combinadas = nodo dedicado de verdad.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: lab-04
spec:
  replicas: 4
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      tolerations:
        - key: lab-04-dedicado
          operator: Equal
          value: batch
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: zone
                    operator: In
                    values: ["zona-b"]
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
