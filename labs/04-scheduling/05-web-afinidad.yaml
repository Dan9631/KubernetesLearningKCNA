# Node affinity: OBLIGATORIO estar en zona-a o zona-b, y se PREFIERE disco hdd.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-afinidad
  namespace: lab-04
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-afinidad
  template:
    metadata:
      labels:
        app: web-afinidad
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: zone
                    operator: In
                    values: ["zona-a", "zona-b"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: disktype
                    operator: In
                    values: ["hdd"]
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
