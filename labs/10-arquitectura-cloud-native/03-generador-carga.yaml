# Generador de carga: pide la pagina de php-apache en bucle.
# Para parar la carga:  kubectl scale deployment generador-carga --replicas=0 -n lab-10
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generador-carga
  namespace: lab-10
  labels:
    app: generador-carga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: generador-carga
  template:
    metadata:
      labels:
        app: generador-carga
    spec:
      containers:
        - name: carga
          image: busybox:1.37
          command:
            - sh
            - -c
            - "while true; do wget -q -O- http://php-apache > /dev/null; done"
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
