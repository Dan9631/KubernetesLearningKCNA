# Modulo 07 - Dos versiones del mismo microservicio, cada una con su Service.
# WHOAMI_NAME hace que whoami imprima "Name: v1" o "Name: v2" en la respuesta.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-v1
  namespace: lab-07
spec:
  replicas: 2
  selector:
    matchLabels: { app: whoami, version: v1 }
  template:
    metadata:
      labels: { app: whoami, version: v1 }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          env:
            - name: WHOAMI_NAME
              value: v1
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-v2
  namespace: lab-07
spec:
  replicas: 1
  selector:
    matchLabels: { app: whoami, version: v2 }
  template:
    metadata:
      labels: { app: whoami, version: v2 }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          env:
            - name: WHOAMI_NAME
              value: v2
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-v1
  namespace: lab-07
spec:
  selector: { app: whoami, version: v1 }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-v2
  namespace: lab-07
spec:
  selector: { app: whoami, version: v2 }
  ports:
    - port: 80
      targetPort: 80
