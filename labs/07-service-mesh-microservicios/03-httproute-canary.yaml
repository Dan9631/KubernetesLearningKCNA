# Modulo 07 - Canary por pesos con Gateway API: 90% a v1, 10% a v2.
# Prueba desde Windows: http://localhost:8080/lab07/canary
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
  namespace: lab-07
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /lab07/canary
      backendRefs:
        - name: whoami-v1
          port: 80
          weight: 90
        - name: whoami-v2
          port: 80
          weight: 10
