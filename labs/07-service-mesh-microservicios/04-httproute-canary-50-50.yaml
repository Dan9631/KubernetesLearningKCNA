# Modulo 07 - Segunda fase del canary: 50% a v1, 50% a v2 (mismo nombre de ruta: kubectl apply la actualiza).
# Prueba desde Windows: http://localhost:8080/lab07/canary
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
  namespace: lab-07
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /lab07/canary
      backendRefs:
        - name: whoami-v1
          port: 80
          weight: 50
        - name: whoami-v2
          port: 80
          weight: 50
