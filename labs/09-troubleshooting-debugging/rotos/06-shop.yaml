# Caso 6 (jefe final, DOS fallos): la tienda se reinicia sola y su Service no responde.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: lab-09
  labels:
    app: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
        tier: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: lab-09
spec:
  selector:
    app: tienda
  ports:
    - port: 80
      targetPort: http
