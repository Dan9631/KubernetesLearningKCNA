# Caso 1 (guiado en el modulo): el frontend no arranca.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lab-09
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpinee
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lab-09
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
