# Application de Argo CD: "sincroniza lo que hay en este repo/ruta con este
# cluster/namespace". Vive en el namespace argocd (donde Argo CD busca sus apps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://git-server.lab-12.svc.cluster.local/app.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-12
  syncPolicy:
    automated:
      prune: true      # si borras un archivo del repo, se borra del cluster
      selfHeal: true   # si alguien cambia el cluster a mano, Argo CD lo revierte
