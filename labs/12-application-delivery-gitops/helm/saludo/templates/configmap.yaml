apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  labels:
    {{- include "saludo.labels" . | nindent 4 }}
data:
  index.html: |
    <h1>{{ .Values.mensaje }}</h1>
    <p>Release: {{ .Release.Name }} - Revision: {{ .Release.Revision }} - Imagen: {{ .Values.image.repository }}:{{ .Values.image.tag }}</p>
