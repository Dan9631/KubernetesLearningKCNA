# Publica el sitio del curso en GitHub Pages cada vez que cambie algo en main.
# Requisitos: en el repositorio, Settings -> Pages -> Source: "GitHub Actions".
# El sitio queda en https://<usuario>.github.io/<repo>/ (PUBLIC_BASE se calcula solo).
name: Publicar sitio del curso

on:
  push:
    branches: [main]
    paths: ['web/**', 'curso/**', 'quiz/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Calidad del contenido antes de publicar: banco de preguntas válido y con fuente oficial,
      # y el simulador de kubectl pasando sus pruebas
      - run: node quiz/src/validate.js --strict
      - run: npm ci
        working-directory: web
      - run: node src/lib/kube/kubectl.test.mjs
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          PUBLIC_BASE: /${{ github.event.repository.name }}
          # URL del Worker de sincronización (variable del repositorio SYNC_URL); vacía = sin sincronización
          PUBLIC_SYNC_URL: ${{ vars.SYNC_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
