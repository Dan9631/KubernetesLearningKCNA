# Clúster de práctica KCNA: 1 control-plane + 2 workers (necesario para labs de scheduling)
# Se crea con:  .\kcna.ps1 up
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kcna
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Ingress (módulo 06) accesible desde Windows en http://localhost:8080
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # NodePort de los labs de Services (30080) -> http://localhost:30080
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
    labels:
      disktype: ssd
      zone: zona-a
  - role: worker
    labels:
      disktype: hdd
      zone: zona-b
